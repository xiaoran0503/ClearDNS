# =====================================================================
# AGH 1.0 实验分支构建（临时 workflow，仅 feat/agh-1.0 分支触发）
# - 产物 tag: agh1.0-preview（不覆盖 latest）
# - 验证通过后合并 master 即删除本文件
# =====================================================================
name: Docker Build (AGH 1.0 preview)

concurrency:
  group: docker-build-agh10
  cancel-in-progress: true

on:
  push:
    branches: [feat/agh-1.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: xiaoran05032/cleardns:agh1.0-preview
          build-args: |
            GH_MIRROR=
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
