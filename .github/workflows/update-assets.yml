name: Update Assets

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install netaddr

      - name: Generate assets
        working-directory: assets
        run: |
          ./gfwlist.py
          ./china-ip.py
          ./chinalist.py

      - name: Validate assets
        working-directory: assets
        run: |
          wc -l gfwlist.txt china-ip.txt chinalist.txt
          test "$(wc -l < gfwlist.txt)" -ge 5000 || { echo "ERROR: gfwlist.txt too small (empty upstream?)"; exit 1; }
          test "$(wc -l < china-ip.txt)" -ge 500  || { echo "ERROR: china-ip.txt too small (empty upstream?)"; exit 1; }
          test "$(wc -l < chinalist.txt)" -ge 5000 || { echo "ERROR: chinalist.txt too small (empty upstream?)"; exit 1; }

      - name: Compress assets
        working-directory: assets
        run: |
          xz -f -9 -k gfwlist.txt
          xz -f -9 -k china-ip.txt
          xz -f -9 -k chinalist.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.txt assets/*.txt.xz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update assets $(date -u +%Y-%m-%d)"
            git push
          fi
