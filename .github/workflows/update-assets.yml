name: Update Assets

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 需要 dispatch 同仓库的 Docker Build（assets 更新后顺带刷新镜像与 ip2region 归属地库）
  actions: write

jobs:
  update-assets:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install netaddr

      - name: Generate assets
        working-directory: assets
        run: |
          ./gfwlist.py
          ./china-ip.py
          ./chinalist.py

      - name: Validate assets
        working-directory: assets
        run: |
          wc -l gfwlist.txt china-ip.txt chinalist.txt
          test "$(wc -l < gfwlist.txt)" -ge 5000 || { echo "ERROR: gfwlist.txt too small (empty upstream?)"; exit 1; }
          test "$(wc -l < china-ip.txt)" -ge 500  || { echo "ERROR: china-ip.txt too small (empty upstream?)"; exit 1; }
          test "$(wc -l < chinalist.txt)" -ge 5000 || { echo "ERROR: chinalist.txt too small (empty upstream?)"; exit 1; }

      - name: Compress assets
        working-directory: assets
        run: |
          xz -f -9 -k gfwlist.txt
          xz -f -9 -k china-ip.txt
          xz -f -9 -k chinalist.txt

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.txt assets/*.txt.xz
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "build: update assets $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # assets 有更新时顺带重建镜像：Dockerfile 的 ip2region 阶段会在构建时拉取
      # lionsoul2014/ip2region master 的最新 v4/v6 xdb，归属地库随每日同步一起刷新。
      # workflow_dispatch 手动触发时同样强制构建（便于手动发布/验证）。
      - name: Trigger Docker build
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-build.yml --ref master
